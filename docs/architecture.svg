<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" font-family="Hind Siliguri, Segoe UI, Helvetica, Arial, sans-serif">
<title>aerosol-all architecture: offline training pipeline and online serving path</title>
<rect width="1280" height="620" fill="#F4EDE1"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5C5249"/></marker><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#B8902F"/></marker></defs>
<text x="24" y="38" font-size="24" font-weight="700" fill="#2B2520">aerosol-all · system architecture</text>
<text x="1256" y="64" text-anchor="end" font-size="12" font-weight="700" letter-spacing="1" fill="#73675C">OFFLINE · ONCE · python -m src.train (about 100 s)</text>
<rect x="24" y="78" width="190" height="150" rx="12" fill="#FBF8F2" stroke="#CFC4B1" stroke-width="1"/>
<text x="38" y="106" font-size="15" font-weight="700" fill="#2B2520">Dataset</text>
<text x="38" y="129" font-size="12" fill="#5C5249">provided .xlsx file</text>
<text x="38" y="148" font-size="12" fill="#5C5249">60 wards × 522 weeks</text>
<text x="38" y="167" font-size="12" fill="#5C5249">2016–2025, one row</text>
<text x="38" y="186" font-size="12" fill="#5C5249">per ward per week</text>
<rect x="232" y="78" width="190" height="150" rx="12" fill="#FBF8F2" stroke="#CFC4B1" stroke-width="1"/>
<text x="246" y="106" font-size="15" font-weight="700" fill="#2B2520">Validate + cache</text>
<text x="246" y="129" font-size="12" fill="#5C5249">src/features.py</text>
<text x="246" y="148" font-size="12" fill="#5C5249">checks columns and gaps</text>
<text x="246" y="167" font-size="12" fill="#5C5249">→ dataset_cache.csv</text>
<line x1="216" y1="153.0" x2="229" y2="153.0" stroke="#5C5249" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="440" y="78" width="190" height="150" rx="12" fill="#FBF8F2" stroke="#B8902F" stroke-width="2"/>
<text x="454" y="106" font-size="15" font-weight="700" fill="#2B2520">Lag features</text>
<text x="454" y="129" font-size="12" fill="#5C5249">per ward: shift(k)</text>
<text x="454" y="148" font-size="12" fill="#5C5249">rain: lags 0–8 weeks</text>
<text x="454" y="167" font-size="12" fill="#5C5249">temp, humidity: 0–4 wk</text>
<text x="454" y="186" font-size="12" fill="#5C5249">season, ward profile</text>
<text x="454" y="205" font-size="12" fill="#5C5249">+ city case rates (4 wk)</text>
<line x1="424" y1="153.0" x2="437" y2="153.0" stroke="#5C5249" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="648" y="78" width="190" height="150" rx="12" fill="#FBF8F2" stroke="#CFC4B1" stroke-width="1"/>
<text x="662" y="106" font-size="15" font-weight="700" fill="#2B2520">Chronological split</text>
<text x="662" y="129" font-size="12" fill="#5C5249">by target week, no shuffle</text>
<text x="662" y="148" font-size="12" fill="#5C5249">train ≤ 2021</text>
<text x="662" y="167" font-size="12" fill="#5C5249">validation 2022–23</text>
<text x="662" y="186" font-size="12" fill="#5C5249">test 2024–25: locked,</text>
<text x="662" y="205" font-size="12" fill="#5C5249">scored once</text>
<line x1="632" y1="153.0" x2="645" y2="153.0" stroke="#5C5249" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="856" y="78" width="190" height="150" rx="12" fill="#FBF8F2" stroke="#CFC4B1" stroke-width="1"/>
<text x="870" y="106" font-size="15" font-weight="700" fill="#2B2520">Model selection</text>
<text x="870" y="129" font-size="12" fill="#5C5249">time-ordered CV, 5 folds</text>
<text x="870" y="148" font-size="12" fill="#5C5249">12 models + 2 baselines</text>
<text x="870" y="167" font-size="12" fill="#5C5249">rules fixed in advance</text>
<text x="870" y="186" font-size="12" fill="#5C5249">tiers, 80% ranges</text>
<text x="870" y="205" font-size="12" fill="#5C5249">calibrated on validation</text>
<line x1="840" y1="153.0" x2="853" y2="153.0" stroke="#5C5249" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1064" y="78" width="190" height="150" rx="12" fill="#EBD9A6" stroke="#CFC4B1" stroke-width="1"/>
<text x="1078" y="106" font-size="15" font-weight="700" fill="#2B2520">Saved artifacts</text>
<text x="1078" y="129" font-size="12" fill="#5C5249">dengue_model.joblib</text>
<text x="1078" y="148" font-size="12" fill="#5C5249">2 wk: weighted ensemble</text>
<text x="1078" y="167" font-size="12" fill="#5C5249">3 wk: 2-model blend</text>
<text x="1078" y="186" font-size="12" fill="#5C5249">4 wk: boosting (Poisson)</text>
<text x="1078" y="205" font-size="12" fill="#5C5249">reports/metrics.json</text>
<line x1="1048" y1="153.0" x2="1061" y2="153.0" stroke="#5C5249" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1256" y="374" text-anchor="end" font-size="12" font-weight="700" letter-spacing="1" fill="#73675C">ONLINE · EACH CLICK · one laptop, no external APIs, no LLM calls</text>
<rect x="24" y="388" width="190" height="150" rx="12" fill="#FBF8F2" stroke="#CFC4B1" stroke-width="1"/>
<text x="38" y="416" font-size="15" font-weight="700" fill="#2B2520">Load once</text>
<text x="38" y="439" font-size="12" fill="#5C5249">model bundle and lag</text>
<text x="38" y="458" font-size="12" fill="#5C5249">features for all wards</text>
<text x="38" y="477" font-size="12" fill="#5C5249">at startup (about 3 s)</text>
<rect x="232" y="388" width="190" height="150" rx="12" fill="#FBF8F2" stroke="#CFC4B1" stroke-width="1"/>
<text x="246" y="416" font-size="15" font-weight="700" fill="#2B2520">Predict + explain</text>
<text x="246" y="439" font-size="12" fill="#5C5249">src/predict.py, explain.py</text>
<text x="246" y="458" font-size="12" fill="#5C5249">all 60 wards in one pass</text>
<text x="246" y="477" font-size="12" fill="#5C5249">tier, 80% range</text>
<text x="246" y="496" font-size="12" fill="#5C5249">exact Shapley drivers</text>
<line x1="216" y1="463.0" x2="229" y2="463.0" stroke="#5C5249" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="440" y="388" width="190" height="150" rx="12" fill="#FBF8F2" stroke="#B8902F" stroke-width="2"/>
<text x="454" y="416" font-size="15" font-weight="700" fill="#2B2520">Service + caches</text>
<text x="454" y="439" font-size="12" fill="#5C5249">api/service.py</text>
<text x="454" y="458" font-size="12" fill="#5C5249">one LRU cache per</text>
<text x="454" y="477" font-size="12" fill="#5C5249">question: forecast,</text>
<text x="454" y="496" font-size="12" fill="#5C5249">ranking, warnings,</text>
<text x="454" y="515" font-size="12" fill="#5C5249">what-if, lag profile</text>
<line x1="424" y1="463.0" x2="437" y2="463.0" stroke="#5C5249" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="648" y="388" width="190" height="150" rx="12" fill="#FBF8F2" stroke="#CFC4B1" stroke-width="1"/>
<text x="662" y="416" font-size="15" font-weight="700" fill="#2B2520">Flask JSON API</text>
<text x="662" y="439" font-size="12" fill="#5C5249">api/main.py · /api/*</text>
<text x="662" y="458" font-size="12" fill="#5C5249">gzip, Cache-Control 1 h</text>
<text x="662" y="477" font-size="12" fill="#5C5249">friendly 400 errors</text>
<text x="662" y="496" font-size="12" fill="#5C5249">live cache counters</text>
<line x1="632" y1="463.0" x2="645" y2="463.0" stroke="#5C5249" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="856" y="388" width="190" height="150" rx="12" fill="#FBF8F2" stroke="#CFC4B1" stroke-width="1"/>
<text x="870" y="416" font-size="15" font-weight="700" fill="#2B2520">Web, no build step</text>
<text x="870" y="439" font-size="12" fill="#5C5249">landing: Check a ward</text>
<text x="870" y="458" font-size="12" fill="#5C5249">outlook, all wards,</text>
<text x="870" y="477" font-size="12" fill="#5C5249">early warnings,</text>
<text x="870" y="496" font-size="12" fill="#5C5249">accuracy, cost &amp; speed</text>
<text x="870" y="515" font-size="12" fill="#5C5249">EN / বাংলা</text>
<line x1="840" y1="463.0" x2="853" y2="463.0" stroke="#5C5249" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1064" y="388" width="190" height="150" rx="12" fill="#3A322B" stroke="#3A322B" stroke-width="1"/>
<text x="1078" y="416" font-size="15" font-weight="700" fill="#F4EDE1">Health officer</text>
<text x="1078" y="439" font-size="12" fill="#E1D8C8">which wards, how many</text>
<text x="1078" y="458" font-size="12" fill="#E1D8C8">cases, how sure, why:</text>
<text x="1078" y="477" font-size="12" fill="#E1D8C8">2–4 weeks before</text>
<text x="1078" y="496" font-size="12" fill="#E1D8C8">the peak</text>
<line x1="1048" y1="463.0" x2="1061" y2="463.0" stroke="#5C5249" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M1159.0 230 V292 H119.0 V385" fill="none" stroke="#5C5249" stroke-width="1.6" marker-end="url(#a)"/>
<text x="1149.0" y="284" text-anchor="end" font-size="12" fill="#5C5249">model file + reports, loaded once at startup</text>
<path d="M535.0 230 V256 H327.0 V385" fill="none" stroke="#B8902F" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#g)"/>
<text x="545.0" y="248" font-size="12" fill="#5C5249">same lag pipeline online (what-if reruns it on typed weather)</text>
<text x="24" y="578" font-size="12" fill="#5C5249">Cache layers, cheapest first: browser memory → HTTP cache (1 h) → server LRU per question → one model pass per week and horizon, reused by every view.</text>
<text x="24" y="598" font-size="12" fill="#5C5249">Gold borders: where the 2–4 week rain lag is built, and where repeat work is saved.</text>
</svg>
